name: CI/CD Innovatech - DB

on:
  push:
    branches: [ deploy ]
    paths:
      - 'db/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push DB Image
        run: |
          docker build -t innovatech-db ./db
          docker tag innovatech-db:latest ${{ secrets.ECR_REGISTRY }}/innovatech-db:latest
          docker push ${{ secrets.ECR_REGISTRY }}/innovatech-db:latest

  deploy-via-ssm:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Mandar comando de despliegue vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar base de datos desde ECR" \
            --parameters '{"commands":[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "sudo docker pull ${{ secrets.ECR_REGISTRY }}/innovatech-db:latest",
              "sudo docker stop innovatech-db || true",
              "sudo docker rm innovatech-db || true",
              "sudo docker run -d --name innovatech-db -p 3306:3306 -v dbdata:/var/lib/mysql ${{ secrets.ECR_REGISTRY }}/innovatech-db:latest"
            ]}'
