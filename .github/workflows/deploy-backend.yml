name: Deploy Backend Service

on:
  push:
    branches: [ deploy ]
    paths:
      - 'back-Ventas_SpringBoot/**'
      - 'back-Despachos_SpringBoot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_BACK }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Asegurar Git y Compatibilidad de Docker
            sudo dnf install git -y || sudo apt-get install git -y
            # Crear enlace simbólico por si se requiere 'docker-compose' con guion
            sudo ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose 2>/dev/null || true
            
            # 2. Clonar si no existe, o actualizar si existe
            if [ ! -d "~/innovatech_stack" ]; then
              git clone https://github.com/afergit/Innovatech-Cloud-Stack.git ~/innovatech_stack
            fi
            
            cd ~/innovatech_stack
            git checkout deploy
            git pull origin deploy
            
            # 3. Levantar servicios (Uso de 'docker compose' moderno)
            export DB_HOST=${{ secrets.EC2_HOST_DB }}
            cd back-Ventas_SpringBoot
            sudo -E docker compose down || true
            sudo -E docker compose up --build -d
