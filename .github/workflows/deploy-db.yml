name: Deploy DB Service

on:
  push:
    branches: [ deploy ]
    paths:
      - 'db/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Deploy to DB EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_DB }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Asegurar Git
            sudo dnf install git -y || sudo apt-get install git -y
            
            # 2. Clonar si no existe, o actualizar si existe
            if [ ! -d "~/innovatech_stack" ]; then
              git clone https://github.com/afergit/Innovatech-Cloud-Stack.git ~/innovatech_stack
            fi
            
            cd ~/innovatech_stack
            git checkout deploy
            git pull origin deploy
            
            # 3. Levantar DB
            cd db
            sudo docker-compose down || true
            sudo docker-compose up -d
