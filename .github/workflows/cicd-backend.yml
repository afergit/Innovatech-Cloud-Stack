name: CI/CD Innovatech - Backend

on:
  push:
    branches: [ deploy ]
    paths:
      - 'back-Ventas_SpringBoot/**'
      - 'back-Despachos_SpringBoot/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Backend Images
        run: |
          docker build -t innovatech-back-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
          docker tag innovatech-back-ventas:latest ${{ secrets.ECR_REGISTRY }}/innovatech-back-ventas:latest
          docker push ${{ secrets.ECR_REGISTRY }}/innovatech-back-ventas:latest
          
          docker build -t innovatech-back-despachos ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker tag innovatech-back-despachos:latest ${{ secrets.ECR_REGISTRY }}/innovatech-back-despachos:latest
          docker push ${{ secrets.ECR_REGISTRY }}/innovatech-back-despachos:latest

  deploy-via-ssm:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Mandar comando de despliegue vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar microservicios desde ECR" \
            --parameters '{"commands":[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "sudo docker pull ${{ secrets.ECR_REGISTRY }}/innovatech-back-ventas:latest",
              "sudo docker pull ${{ secrets.ECR_REGISTRY }}/innovatech-back-despachos:latest",
              "sudo docker stop back-ventas back-despachos || true",
              "sudo docker rm back-ventas back-despachos || true",
              "sudo docker run -d --name back-ventas -p 8080:8080 -e DB_HOST=${{ secrets.EC2_HOST_DB }} ${{ secrets.ECR_REGISTRY }}/innovatech-back-ventas:latest",
              "sudo docker run -d --name back-despachos -p 8081:8081 -e DB_HOST=${{ secrets.EC2_HOST_DB }} ${{ secrets.ECR_REGISTRY }}/innovatech-back-despachos:latest"
            ]}'
