name: Deploy Frontend Service (ECR + SSM)

on:
  push:
    branches: [ deploy ]
    paths:
      - 'front_despacho/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Frontend Image
        run: |
          docker build -t innovatech-front \
            --build-arg VITE_API_URL_VENTAS=http://${{ secrets.EC2_HOST_BACK }}:8080 \
            --build-arg VITE_API_URL_DESPACHOS=http://${{ secrets.EC2_HOST_BACK }}:8081 \
            ./front_despacho
          docker tag innovatech-front:latest ${{ secrets.ECR_REGISTRY }}/innovatech-front:latest
          docker push ${{ secrets.ECR_REGISTRY }}/innovatech-front:latest

  deploy-via-ssm:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Mandar comando de despliegue vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar frontend desde ECR" \
            --parameters '{"commands":[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "sudo docker pull ${{ secrets.ECR_REGISTRY }}/innovatech-front:latest",
              "sudo docker stop innovatech-front || true",
              "sudo docker rm innovatech-front || true",
              "sudo docker run -d --name innovatech-front -p 80:80 ${{ secrets.ECR_REGISTRY }}/innovatech-front:latest"
            ]}'
