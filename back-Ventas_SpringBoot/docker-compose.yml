version: '3.8'
services:
  back-ventas:
    build: ./Springboot-API-REST
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:3306/ventasdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=springuser
      - SPRING_DATASOURCE_PASSWORD=springpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - back-net

  back-despachos:
    build: ../back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:3306/ventasdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=springuser
      - SPRING_DATASOURCE_PASSWORD=springpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - back-net

networks:
  back-net:
    driver: bridge
